name: Build YouTube Module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-youtube:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2

      - name: Build YouTube DLL
        run: cargo build --release -p module-youtube

      - name: Prepare YouTube package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Modules/youtube | Out-Null
          Copy-Item target/release/module_youtube.dll package/Modules/youtube/module_youtube.dll
          Copy-Item Modules/youtube/module.json package/Modules/youtube/module.json

      - name: Upload YouTube artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniDownloader-YouTube-Windows
          if-no-files-found: error
          path: package/**
