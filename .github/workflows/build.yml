name: Build Core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2

      - name: Build Core
        run: cargo build --release -p core

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniDownloader-Core-Windows
          if-no-files-found: error
          path: |
            target/release/UniDownloader.exe
            Modules/udio/module.json
            Modules/youtube/module.json
            Icon.ico
