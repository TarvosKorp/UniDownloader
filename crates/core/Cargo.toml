[package]
name = "core"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "UniDownloader"
path = "src/main.rs"

[dependencies]
module-api = { path = "../module-api" }
module-udio = { path = "../module-udio" }
module-youtube = { path = "../module-youtube" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lnks = "0.2" # Для создания ярлыков

[build-dependencies]
tauri-build = { version = "2", features = [] }