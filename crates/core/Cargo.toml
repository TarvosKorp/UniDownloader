[package]
name = "core"
version.workspace = true
edition.workspace = true
build = "build.rs" # <-- добавляем

[[bin]]
name = "UniDownloader"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
lnks = "0.2"
arboard = "3"           # <-- для контекстного меню (буфер обмена)

[build-dependencies]
winres = "0.1" # <-- добавляем