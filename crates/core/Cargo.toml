[package]
name = "core"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "UniDownloader"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
lnks = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }