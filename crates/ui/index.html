<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniDownloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>UniDownloader</h1>
        
        <div class="control-group">
            <label for="module-select">Select Module:</label>
            <select id="module-select">
                <option value="" disabled selected>Loading modules...</option>
            </select>
        </div>

        <button id="create-shortcuts-btn" class="secondary-btn">Create Shortcuts</button>
        <div id="status" class="status"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
